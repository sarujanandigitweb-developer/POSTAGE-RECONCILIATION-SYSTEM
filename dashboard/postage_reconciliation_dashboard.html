<!--
  POSTAGE RECONCILIATION SYSTEM · STANDALONE DASHBOARD (single file, no dependencies)
  Business reference : Accounts postage_reconciliation_v3_merged.xlsx (v3.4) — README sheet mapping
  Data source        : PostgreSQL via Claude MCP (read-only). Reporting week W27 2026
                       (2026-06-29 -> 2026-07-05), as-of 2026-07-08.

  CORRECTED DATA MODEL (fixes prior mis-fetch):
   • Actual Postage Cost  = order_shipping_billing_detail.carrier_charge  (reliable, 4.8% null).
   • Expected Cost        = prior 8-week (W19-W26) avg carrier_charge per carrier × current labels
                            — the README Section-15 "fall back to a default per carrier" rule.
                            (shipping_template_price is 67% zero -> NOT used; that was the earlier bug.)
   • Variance / Status    = Actual - Expected, classified OK/CHECK/LEAK/KILL by the workbook formula.
   Counts are authoritative. £ from a single real column (carrier_charge). No workbook logic invented.
-->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postage Reconciliation Dashboard</title>
<style>
  :root{
    --header:#15243d; --header-2:#1d3357; --band:#b03a3a;
    --bg:#eaeef4; --surface:#ffffff; --surface-2:#f5f8fc; --surface-3:#eef3f9;
    --text:#16223a; --muted:#647089; --border:#dde4ee; --border-2:#e8edf5;
    --accent:#2f6fd0; --accent-weak:#e7f0fc;
    --ok:#177a44; --ok-bg:#dcf5e6; --check:#9a6212; --check-bg:#fbeecb;
    --leak:#c62828; --leak-bg:#fbe0df; --kill:#7a1620; --kill-bg:#f6d3d6;
    --pass:#177a44; --pass-bg:#dcf5e6; --fail:#c62828; --fail-bg:#fbe0df; --na:#647089; --na-bg:#eaeef4;
    --pos:#c62828; --neg:#177a44;
    --shadow:0 1px 2px rgba(20,35,64,.06),0 2px 8px rgba(20,35,64,.06);
    --radius:12px; --r-sm:8px;
  }
  html[data-theme="dark"]{
    /* Enterprise slate palette — high contrast, no washed-out / overly bright cards. Header keeps #15243d. */
    --header:#15243d; --header-2:#1b2c49; --band:#9c3a3a;
    --bg:#0e141f; --surface:#171f2c; --surface-2:#1e2735; --surface-3:#242f40;
    --text:#e7ecf4; --muted:#94a1b5; --border:#2b3648; --border-2:#232d3c;
    --accent:#5b9bf0; --accent-weak:#17273c;
    --ok:#3ecf8e; --ok-bg:#0f2c22; --check:#e0a63a; --check-bg:#352a11;
    --leak:#f07a72; --leak-bg:#391b19; --kill:#f0a3a0; --kill-bg:#41211f;
    --pass:#3ecf8e; --pass-bg:#0f2c22; --fail:#f07a72; --fail-bg:#391b19; --na:#94a1b5; --na-bg:#232d3c;
    --pos:#f07a72; --neg:#3ecf8e;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.38);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  /* Header */
  header.app{background:linear-gradient(180deg,var(--header),var(--header-2));color:#fff;
    padding:0 26px;height:76px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:50;
    box-shadow:0 2px 10px rgba(0,0,0,.22)}
  header.app .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#3a6fb5,#6ea0dd);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
    box-shadow:0 2px 8px rgba(0,0,0,.25)}
  header.app .brand{margin-right:auto;display:flex;flex-direction:column;gap:3px;min-width:0}
  header.app h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.app .sub{font-size:11.5px;color:#9fb0cc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbadge{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);padding:7px 13px;
    border-radius:8px;font-size:11px;color:#cdd9ec;white-space:nowrap;line-height:1.35}
  .hbadge b{color:#fff;font-weight:600}
  .theme-btn{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.2);
    padding:8px 13px;border-radius:8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;font-weight:550;
    transition:background .15s,border-color .15s}
  .theme-btn:hover{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35)}
  /* Tabs — pill style, clear hover + active */
  nav.tabs{background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:8px;
    padding:9px 22px 0;position:sticky;top:76px;z-index:40;overflow-x:auto;scrollbar-width:thin}
  nav.tabs button{position:relative;background:none;border:none;color:var(--muted);
    padding:11px 17px 12px;margin-bottom:-1px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;
    border-radius:8px 8px 0 0;transition:color .15s,background .15s}
  nav.tabs button::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2.5px;
    border-radius:2px 2px 0 0;background:transparent;transition:background .15s,left .15s,right .15s}
  nav.tabs button:hover{color:var(--text);background:var(--surface-2)}
  nav.tabs button:hover::after{background:var(--border)}
  nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  nav.tabs button.active{color:var(--accent);background:var(--accent-weak)}
  nav.tabs button.active::after{background:var(--accent);left:0;right:0}
  /* Reporting-week band (mirrors the workbook red banner) */
  .weekband{background:var(--band);color:#fff;padding:7px 24px;font-size:12px;font-weight:600;letter-spacing:.3px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .weekband .dot{width:7px;height:7px;border-radius:50%;background:#ffd9d9}
  .weekband .light{font-weight:400;color:#ffe3e3}
  /* Filters */
  .filters{background:var(--surface-2);border-bottom:1px solid var(--border);padding:10px 24px;
    display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .filters .fld{display:flex;flex-direction:column;gap:3px}
  .filters label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .filters select,.filters input{background:var(--surface);border:1px solid var(--border);color:var(--text);
    padding:7px 10px;border-radius:var(--r-sm);font-size:12.5px;min-width:150px;outline:none;transition:.15s}
  .filters select:focus,.filters input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .filters .clear{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 13px;
    border-radius:var(--r-sm);cursor:pointer;font-size:12px;font-weight:600}
  .filters .clear:hover{color:var(--accent);border-color:var(--accent)}
  /* Layout — wide, minimal side margin */
  main{padding:16px 18px 10px;margin:0 auto;width:100%}
  .page{display:none;animation:fade .22s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .note{background:var(--accent-weak);border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:var(--r-sm);padding:10px 13px;font-size:12px;color:var(--text);margin-bottom:18px}
  .note b{color:var(--accent)}
  .note code{background:var(--surface-3);padding:1px 5px;border-radius:4px;font-size:11px}
  h2.sec{font-size:13px;margin:24px 0 11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    display:flex;align-items:center;gap:8px}
  h2.sec::before{content:"";width:3px;height:14px;background:var(--accent);border-radius:2px}
  h2.sec:first-child{margin-top:2px}
  .muted{color:var(--muted)}
  /* KPI cards */
  /* Full-width KPI strip: auto-fit stretches columns edge-to-edge (no right-side gap). Compact height. */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;width:100%}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 12px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s;
    display:flex;flex-direction:column;justify-content:center;min-height:0}
  .card:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(20,35,64,.12)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
  .card.c-ok::before{background:var(--ok)} .card.c-warn::before{background:var(--check)}
  .card.c-cost::before{background:#7c5cd0} .card.c-na::before{background:var(--muted)}
  .card .k-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .k-value{font-size:21px;font-weight:750;margin-top:3px;letter-spacing:-.4px;line-height:1.05;white-space:nowrap}
  .card .k-sub{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card.c-na .k-value{color:var(--muted);font-size:14px;font-weight:650}
  /* Tables */
  .tablewrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden}
  .tabletools{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 15px;
    border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tabletools .ttitle{font-size:13px;font-weight:700}
  .tabletools .tcount{font-size:11px;color:var(--muted);font-weight:600;margin-left:8px}
  /* Search: icon sits inside the field; the box grows to fill the tools bar. */
  .tabletools .searchbox{position:relative;display:flex;align-items:center;flex:1 1 320px;max-width:520px;margin-left:auto}
  .tabletools .searchbox svg{position:absolute;left:11px;width:15px;height:15px;stroke:var(--muted);
    fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none;transition:stroke .15s}
  .tabletools .searchbox:focus-within svg{stroke:var(--accent)}
  .tabletools input.search{background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:9px 12px 9px 34px;border-radius:var(--r-sm);font-size:12.5px;width:100%;outline:none;
    transition:border-color .15s,box-shadow .15s,background .15s}
  .tabletools input.search::placeholder{color:var(--muted)}
  .tabletools input.search:hover{border-color:var(--muted)}
  .tabletools input.search:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-weak)}
  @media(max-width:720px){.tabletools .searchbox{flex-basis:100%;max-width:none;margin-left:0}}
  /* no-JS fallback; fitTables() overwrites max-height inline from the viewport */
  .tscroll{overflow:auto;max-height:600px;overscroll-behavior:contain}
  .nullv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted);
    background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;opacity:.75;cursor:help}
  .lkp{font-size:9.5px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);
    border-radius:4px;padding:1px 4px;cursor:help}
  /* ── Rate Card ─────────────────────────────────────────────── */
  .rc-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%;margin-bottom:10px}
  .rc-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 12px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;transition:border-color .14s,box-shadow .14s}
  .rc-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
  .rc-card:hover{box-shadow:0 4px 12px rgba(20,35,64,.11);border-color:var(--accent)}
  .rc-card .rc-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700;line-height:1.1;white-space:nowrap}
  .rc-card .rc-v{font-size:19px;font-weight:750;letter-spacing:-.4px;line-height:1.15;margin-top:1px;font-variant-numeric:tabular-nums}
  .rc-card .rc-s{font-size:9px;color:var(--muted);margin-top:0;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media(max-width:1100px){.rc-cards{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:640px){.rc-cards{grid-template-columns:repeat(2,1fr)}}
  /* taller header row (+2 units), active states */
  .rc thead th{padding:16px 14px;font-size:11px;letter-spacing:.6px;line-height:1.25}
  .rc thead th.sorted{color:var(--accent);background:var(--accent-weak)}
  .rc tbody td{padding:9px 14px}
  .rc tbody tr{transition:background .1s}
  .rc tbody tr:hover{background:var(--accent-weak)}
  .rc tbody tr:hover td{color:var(--text)}
  .rc tbody tr:active{background:var(--surface-3)}
  .rc tbody tr:focus-within{outline:2px solid var(--accent);outline-offset:-2px}
  .rc .tscroll{scrollbar-width:thin}
  .pager{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:8px 13px;border-top:1px solid var(--border);
    background:var(--surface-2);font-size:11.5px;color:var(--muted)}
  .pager .pginfo{font-weight:700;color:var(--text)}
  .pager .pgbtns{display:flex;align-items:center;gap:5px;margin-left:auto}
  .pager button{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;
    padding:4px 9px;font:inherit;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s}
  .pager button:hover:not(:disabled){background:var(--surface-3);border-color:var(--accent)}
  .pager button:disabled{opacity:.42;cursor:not-allowed}
  .pager .pgnum{padding:0 8px;font-weight:700;color:var(--text);white-space:nowrap}
  .pager .pgsize select{background:var(--surface);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:3px 6px;font:inherit}
  @media(max-width:720px){.pager{font-size:11px;gap:9px}.pager .pgbtns{margin-left:0}}
  table{border-collapse:collapse;width:100%;font-size:12.8px}
  thead th{position:sticky;top:0;background:var(--surface-3);z-index:2;text-align:left;padding:18px 13px;
    border-bottom:2px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted);font-weight:700;cursor:pointer;white-space:nowrap;user-select:none;
    transition:color .12s,background .12s}
  thead th:hover{color:var(--text);background:var(--surface-2)}
  thead th.sorted{color:var(--accent);background:var(--accent-weak)}
  thead th .arrow{opacity:.85;font-size:9px;margin-left:3px}
  /* Daily Control only — long Sheet 2 headers wrap to a MAXIMUM of two lines.
     No max-width (that forced a 3rd line); instead each long column gets a min-width
     wide enough for its longest word-group, and words are never split.
     Cells stay on one line; .tscroll gives a horizontal scrollbar when needed. */
  .dc-table thead th{white-space:normal;word-break:keep-all;overflow-wrap:normal;hyphens:none;
    line-height:1.25;vertical-align:bottom;min-width:94px;padding-top:8px;padding-bottom:8px}
  .dc-table thead th:nth-child(1){min-width:104px}   /* Date */
  .dc-table thead th:nth-child(4){min-width:110px}   /* Wayfair (3rd party) */
  .dc-table thead th:nth-child(5){min-width:124px}   /* Self-Labelled (expected) */
  .dc-table thead th:nth-child(6){min-width:112px}   /* Labels in Booking Log */
  .dc-table thead th:nth-child(7){min-width:100px}   /* Order vs Label Gap */
  .dc-table thead th:nth-child(8){min-width:168px}   /* Forecast £ Inc VAT (from Booking Log) */
  .dc-table thead th:nth-child(13){min-width:132px}  /* Service Labels (expected) */
  .dc-table thead th:nth-child(14){min-width:132px}  /* Service Labels in BL */
  .dc-table thead th:nth-child(16){min-width:104px}  /* Service Forecast £ */
  .dc-table thead th .arrow{white-space:nowrap}
  .dc-table tbody td{white-space:nowrap}
  .dc-table .tscroll{overflow-x:auto}
  thead th.num,tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody td{padding:9px 13px;border-bottom:1px solid var(--border-2);white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:nth-child(even){background:var(--surface-2)}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--accent-weak);box-shadow:inset 3px 0 0 var(--accent)}
  tbody tr:hover td{color:var(--text)}
  tbody tr.total-row td{font-weight:750;background:var(--surface-3);border-top:2px solid var(--border)}
  .empty{padding:38px;text-align:center;color:var(--muted);font-size:13px}
  /* Pills */
  .pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:10.5px;font-weight:800;letter-spacing:.4px}
  .pill.ok{color:var(--ok);background:var(--ok-bg)} .pill.check{color:var(--check);background:var(--check-bg)}
  .pill.leak{color:var(--leak);background:var(--leak-bg)} .pill.kill{color:var(--kill);background:var(--kill-bg)}
  .pill.pass{color:var(--pass);background:var(--pass-bg)} .pill.fail{color:var(--fail);background:var(--fail-bg)}
  .pill.na{color:var(--na);background:var(--na-bg)}
  .pos{color:var(--pos);font-weight:650} .neg{color:var(--neg);font-weight:650}
  /* mini bar chart */
  .bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:14px 16px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .bar .col{width:70%;max-width:46px;background:linear-gradient(180deg,var(--accent),#6ea0dd);border-radius:5px 5px 0 0;transition:height .3s}
  .bar .bv{font-size:10.5px;font-weight:700;color:var(--text)}
  .bar .bl{font-size:10px;color:var(--muted);white-space:nowrap}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}}
  /* Focus states (keyboard accessibility) */
  button:focus-visible,select:focus-visible,input:focus-visible,th:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  nav.tabs button:focus-visible{outline-offset:-2px}
  footer.app{padding:16px 24px;color:var(--muted);font-size:11px;text-align:center;border-top:1px solid var(--border);margin-top:26px}
  /* Responsive */
  @media(max-width:760px){
    header.app{padding:0 14px;gap:10px} header.app h1{font-size:14px} header.app .sub{display:none}
    nav.tabs{top:60px;padding:0 8px} .weekband{padding:7px 14px;font-size:11px}
    main{padding:14px 12px} .filters{padding:10px 12px} .filters select,.filters input{min-width:120px}
    .card .k-value{font-size:21px}
    .hbadge{display:none}
  }
</style>
</head>
<body>
<header class="app">
  <div class="logo">📦</div>
  <div class="brand">
    <h1>Postage Reconciliation Dashboard</h1>
    <span class="sub">Accounts Team · read-only operational view · workbook v3.4 · PostgreSQL</span>
  </div>
  <span class="hbadge">Reporting week<br><b id="hb-week">—</b></span>
  <span class="hbadge">Data as of<br><b id="hb-refresh">—</b></span>
  <button class="theme-btn" id="themeBtn"><span id="themeIcon">🌙</span><span id="themeTxt">Dark</span></button>
</header>

<nav class="tabs" id="tabs"></nav>
<div class="weekband" id="weekband"></div>
<div class="filters" id="filters"></div>
<main id="main"></main>
<footer class="app" id="footer"></footer>

<script>
/* =====================================================================
   EMBEDDED DATA — corrected PostgreSQL export, reporting week W27 2026.
   Actual £ = carrier_charge (real). Estimated Cost (Historical Baseline) = prior-8-week avg rate ×
   labels (README "default per carrier" fallback). Counts authoritative.
   ===================================================================== */
const dashboardData = {
  overview:{
    reporting_week:"W27 2026", week_start:"2026-06-29", week_end:"2026-07-05", as_of:"2026-07-09",
    week_range:"29 Jun – 05 Jul 2026",
    total_orders:4031, fba_excluded:393, wayfair:147, self_labelled:3491, labels:3638,
    actual_cost_gbp:12527.90, estimated_cost_gbp:12650.46, variance_gbp:-122.56, variance_pct:-0.0097,
    avg_cost_per_label:3.62,
    daily_recon_accuracy:null,   // NOT COMPUTABLE — see kpis row 22
    leakage_gbp:99.91,              // Leakage Register OPEN TOTAL (status in Open/Investigating/Chase carrier)
    open_disputes:1              // DHL (Open). Others is "Killed" -> not an open dispute (README S13).
  },
  /* Weekly Invoice Check — Sheet 5, cols A–P, exact workbook order.
     A week_start · B week_end · C carrier · D labels (Labels Generated) · E forecast_ex_vat ·
     F forecast_inc_vat · G invoice_inc_vat · H inv_variance_gbp · I inv_variance_pct · J inv_status ·
     K owner · L customer_labels · M service_labels · N customer_forecast_gbp · O service_forecast_gbp ·
     P week_label
     G is MANUAL ENTRY per the workbook ("from carrier portal/email · NULL until invoice received").

  filters:{carrier:"",destination:"",week:"",status:"",issue:""},sort:{},search:{},page:{},perPage:{}};

const gbp=v=>(v===null||v===undefined)?'<span class="muted">—</span>':'£'+Number(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const gbp0=v=>(v===null||v===undefined)?'—':'£'+Number(v).toLocaleString('en-GB',{maximumFractionDigits:0});
const pct=v=>(v===null||v===undefined)?'<span class="muted">—</span>':(Number(v)*100).toFixed(2)+'%';
const num=v=>(v===null||v===undefined)?'<span class="muted">—</span>':Number(v).toLocaleString('en-GB');
const rate=v=>(v===null||v===undefined)?'<span class="muted">—</span>':'£'+Number(v).toFixed(2);
const sGbp=v=>{if(v===null||v===undefined)return '<span class="muted">—</span>';const c=v>0?'pos':(v<0?'neg':'');return '<span class="'+c+'">'+(v>0?'+':'')+'£'+Number(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})+'</span>';};
const sPct=v=>{if(v===null||v===undefined)return '<span class="muted">—</span>';const c=v>0?'pos':(v<0?'neg':'');return '<span class="'+c+'">'+(v>0?'+':'')+(Number(v)*100).toFixed(2)+'%</span>';};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>{const[y,m,dd]=d.split('-');return dd+' '+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]+' '+y;};
const statusPill=s=>'<span class="pill '+({OK:'ok',CHECK:'check',LEAK:'leak',KILL:'kill'}[s]||'na')+'">'+esc(s)+'</span>';
const kpiPill=(s,t)=>'<span class="pill '+({PASS:'pass',FAIL:'fail'}[s]||'na')+'"'+(t?' title="'+esc(t)+'"':'')+'>'+esc(s)+'</span>';

function renderTable(o){
  const k=o.key,s=state.sort[k],term=(state.search[k]||"").toLowerCase();
  let rows=o.rows.slice();
  if(term)rows=rows.filter(r=>o.columns.some(c=>String(r[c.k]??"").toLowerCase().includes(term)));
  if(s)rows.sort((a,b)=>{let x=a[s.key],y=b[s.key];if(x===null||x===undefined)x=-Infinity;if(y===null||y===undefined)y=-Infinity;
    return (typeof x==='number'&&typeof y==='number')?(x-y)*s.dir:String(x).localeCompare(String(y))*s.dir;});
  const total=rows.length;
  let pager='';
  if(o.paginate){
    const per=state.perPage[k]||o.perPage||50;
    const pages=Math.max(1,Math.ceil(total/per));
    let pg=state.page[k]||1; if(pg>pages)pg=pages; if(pg<1)pg=1; state.page[k]=pg;
    const from=(pg-1)*per,to=Math.min(from+per,total);
    rows=rows.slice(from,to);
    const btn=(g,lab,dis)=>'<button data-pg="'+k+'" data-goto="'+g+'"'+(dis?' disabled':'')+'>'+lab+'</button>';
    pager='<div class="pager"><span class="pginfo">'+(total?from+1:0)+'–'+to+' of '+total+'</span>'
      +'<span class="pgbtns">'+btn(1,'« First',pg===1)+btn(pg-1,'‹ Prev',pg===1)
      +'<span class="pgnum">Page '+pg+' / '+pages+'</span>'
      +btn(pg+1,'Next ›',pg===pages)+btn(pages,'Last »',pg===pages)+'</span>'
      +'<span class="pgsize">Rows <select data-pp="'+k+'">'
      +[25,50,100,250].map(n=>'<option'+(n===per?' selected':'')+'>'+n+'</option>').join('')+'</select></span></div>';
  }
  const head=o.columns.map(c=>{const on=s&&s.key===c.k;
    const a=on?'<span class="arrow">'+(s.dir>0?'▲':'▼')+'</span>':'';
    return '<th class="'+(c.cls||'')+(on?' sorted':'')+'" data-sk="'+k+'" data-col="'+c.k+'">'+esc(c.label)+a+'</th>';}).join('');
  let body;
  if(!total)body='<tr><td class="empty" colspan="'+o.columns.length+'">'+(o.emptyMsg||'No rows match the current filters.')+'</td></tr>';
  else{
    body=rows.map(r=>'<tr>'+o.columns.map(c=>'<td class="'+(c.cls||'')+'">'+(c.html?c.html(r):(c.fmt?c.fmt(r[c.k]):esc(r[c.k]??'')))+'</td>').join('')+'</tr>').join('');

function applyFilters(rows){const f=state.filters;return rows.filter(r=>{
  if(f.carrier&&r.carrier!==f.carrier)return false;
  if(f.destination&&r.destination!==undefined&&r.destination!==f.destination)return false;
  if(f.week&&r.week_label!==undefined&&r.week_label!==f.week)return false;
  if(f.status&&r.status!==undefined&&r.status!==f.status)return false;
  if(f.issue&&r.issue_type!==undefined&&r.issue_type!==f.issue)return false;return true;});}

const txt=v=>(v===null||v===undefined||v==='')?'<span class="muted">—</span>':esc(v);

const REQ={
  label_type:"Requires public.shipment.label_type (schema)",

  weight_band:"Requires order_shipping_billing_detail.weight_band_kg (schema)",

  rate_card:"Requires the rate card in PostgreSQL — blos.postage exists but has 0 rows (ETL backfill)",
  invoice:"Requires invoice_received_amount / _date / _batch_id (schema + ETL)",
  dispute:"Requires a dispute / credit_recovered table (schema)",
  helpdesk:"Requires the CS-helpdesk feed into PostgreSQL (ETL)",

};

/* KPI Target + PASS/FAIL derived from the BLOS object via blos_key.
   No threshold is hardcoded in the render (README audit check #2). */
function kpiTarget(r){return r.row===23?0:BLOS()[r.blos_key];}
function kpiStatus(r){
  if(r.actual===null||r.actual===undefined)return "NOT COMPUTABLE";
  const t=BLOS()[r.blos_key];
  if(r.row===23)return (r.actual===0||r.actual<t)?"PASS":"FAIL";
  return r.direction==="higher"?(r.actual>=t?"PASS":"FAIL"):(r.actual<=t?"PASS":"FAIL");
}

  const blosT=renderTable({key:"blos",title:"BLOS Thresholds — "+blos.length+" keys (workbook; blos schema empty)",search:false,rows:blos,
    columns:[{k:"key",label:"BLOS Key"},{k:"val",label:"Current Value",cls:"num"}]});
  const listRows=[{list:"Carriers",n:L.carriers.length,items:L.carriers.join(", ")},
    {list:"Statuses",n:L.statuses.length,items:L.statuses.join(", ")},
    {list:"Issue Types",n:L.issueTypes.length,items:L.issueTypes.join(", ")},
    {list:"Label Types",n:L.labelTypes.length,items:L.labelTypes.join(", ")},
    {list:"Destinations",n:L.destinations.length,items:L.destinations.join(", ")},
    {list:"Weight Bands",n:L.weightBands.length,items:L.weightBands.join(", ")},
    {list:"Owners",n:L.owners.length,items:L.owners.join(", ")}];
  const listsT=renderTable({key:"lists",title:"Lists — Sheet 8 (dropdown sources)",search:false,rows:listRows,
    columns:[{k:"list",label:"List"},{k:"n",label:"Count",cls:"num"},{k:"items",label:"Values",html:r=>'<span class="muted">'+esc(r.items)+'</span>'}]});
  const trend=renderTable({key:"trend",title:"Order volume — last 6 ISO weeks",search:false,rows:dashboardData.weeklyTrend,
    columns:[{k:"iso_week",label:"ISO Week"},{k:"orders",label:"Orders",cls:"num",fmt:num}]});
  const svc=renderTable({key:"svc",title:"Service-label proxies (source_name — NOT label_type)",search:false,rows:dashboardData.serviceProxies,
    columns:[{k:"proxy",label:"Source proxy"},{k:"orders",label:"Orders",cls:"num",fmt:num}]});
  const gaps=md.gaps.map(x=>'<li>'+esc(x)+'</li>').join('');
  return '<div class="note">Provenance, dropdown sources and known production gaps — so no figure is mistaken for something it is not.</div>'
    +'<div class="tablewrap"><div class="tscroll"><table><tbody>'
    +'<tr><td style="width:190px"><b>Source</b></td><td>'+esc(md.source)+'</td></tr>'
    +'<tr><td><b>Tables</b></td><td>'+esc(md.tables.join(', '))+'</td></tr>'
    +'<tr><td><b>As of</b></td><td>'+esc(md.as_of)+'</td></tr>'
    +'<tr><td><b>Financial basis</b></td><td>'+esc(md.financial_basis)+'</td></tr>'
    +'<tr><td><b>Carrier mapping</b></td><td>'+esc(md.carrier_mapping)+'</td></tr>'
    +'</tbody></table></div></div>'
    +'<h2 class="sec">Production gaps (README fields with no PostgreSQL source)</h2><div class="note"><ul style="margin:4px 0 0 18px;padding:0">'+gaps+'</ul></div>'
    +'<h2 class="sec">Lists (Sheet 8)</h2>'+listsT
    +'<h2 class="sec">BLOS Thresholds</h2>'+blosT
    +'<h2 class="sec">Return Label In — verified (README Section 21)</h2>'
    +'<div class="note"><b>'+num(R.return_label_in)+' return labels</b> in '+esc(R.week_label)+' → return rate <b>'+pct(R.return_rate)+'</b> of '
    +num(R.customer_order_labels)+' customer-order labels — <b>FAILS</b> the 2% target on every basis '
    +'(billed-only '+pct(R.alt_billed_only.rate)+' · orders denominator '+pct(R.alt_orders_denominator.rate)+'). '
    +'Excludes '+R.excluded.fba_returns+' FBA returns, '+R.excluded.amazon_unpaid_labels+' AmazonUnPaidLabel (customer-paid) and '
    +R.excluded.shopify_refunds_no_label+' Shopify refunds (no label field). <b>Return Label Out is unavailable</b> (needs <code>shipment.label_type</code>), so this is a lower bound. '
    +'Costs mix GBP/EUR/USD — deliberately not summed.</div>'
    +renderTable({key:"returnLabels",title:"Return Label In — source-by-source evidence",search:false,rows:R.rows,
       columns:[{k:"source",label:"Source"},{k:"tbl",label:"PostgreSQL table"},
         {k:"labels",label:"Labels",cls:"num",html:r=>r.labels===null?'<span class="muted">—</span>':num(r.labels)},
         {k:"cost",label:"Label cost",cls:"num",html:r=>r.cost===null?'<span class="muted">—</span>':r.cost.toFixed(2)},
         {k:"ccy",label:"Ccy"},{k:"basis",label:"Basis",html:r=>'<span class="muted">'+esc(r.basis)+'</span>'}]})
    +'<div class="two-col"><div>'+trend+'</div><div>'+svc+'</div></div>';
}

const PAGES={dashboard:pageDashboard,daily:pageDaily,weekly:pageWeekly,leakage:pageLeakage,booking:pageBooking,ratecard:pageRateCard,reference:pageReference};

function buildFilters(){
  const L=dashboardData.lookups;
  const carriers=[...new Set(dashboardData.carrierSummary.map(r=>r.carrier))];
  const dests=[...new Set(dashboardData.bookingLog.map(r=>r.destination).filter(Boolean))].sort();
  const weeks=["W27 2026"];
  const sel=(id,label,opts,val)=>'<div class="fld"><label>'+label+'</label><select data-filter="'+id+'"><option value="">All</option>'+opts.map(o=>'<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';
  let s='';
  if(["dashboard","weekly","booking","leakage"].includes(state.tab))s+=sel('carrier','Carrier',carriers,state.filters.carrier);
  if(state.tab==="booking")s+=sel('destination','Destination',dests,state.filters.destination);
  if(state.tab==="leakage"){s+=sel('status','Status',L.statuses,state.filters.status);s+=sel('issue','Issue Type',L.issueTypes,state.filters.issue);}
  if(state.tab==="ratecard"){
    // Rate-card carriers are the blos.* carrier_name values — not the carrierSummary families.
    const rc=[...new Set(dashboardData.rateCard.map(r=>r.carrier))].sort();
    s+=sel('carrier','Carrier',rc,state.filters.carrier);
  } else {
    s+=sel('week','Week',weeks,state.filters.week);
  }
  s+='<button class="clear" id="clearFilters">Clear filters</button>';
  document.getElementById('filters').innerHTML=s;
}
/* Size each table's scroll area so the table bottom lands on the viewport bottom.
   Measured, not hardcoded: the KPI strip and filter bar differ in height per tab. */
function fitTables(){
  const scrolls=document.querySelectorAll('.tscroll');
  if(!scrolls.length) return;
  const MIN=320, GAP=10;
  const foot=document.getElementById('footer');
  const footH=foot?foot.getBoundingClientRect().height+GAP:0;
  scrolls.forEach(el=>{
    if(scrolls.length>1){el.style.maxHeight='420px';return;} // stacked tables: page scrolls instead
    el.style.maxHeight='none';
    const top=el.getBoundingClientRect().top+window.scrollY; // absolute, so a scrolled page can't skew it
    const wrap=el.closest('.tablewrap');
    const pager=wrap?wrap.querySelector('.pager'):null;
    const below=(pager?pager.getBoundingClientRect().height:0)+footH+GAP;
    el.style.maxHeight=Math.max(MIN,window.innerHeight-top-below)+'px';
  });
}
let fitT;
window.addEventListener('resize',()=>{clearTimeout(fitT);fitT=setTimeout(fitTables,120);});
window.addEventListener('load',fitTables); // re-measure once webfonts/scrollbars settle

function render(){
  document.getElementById('main').innerHTML='<div class="page active">'+PAGES[state.tab]()+'</div>';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  buildFilters();
  fitTables();
}
function initTabs(){
  const n=document.getElementById('tabs');
  n.innerHTML=TABS.map(t=>'<button data-tab="'+t.id+'"'+(t.id===state.tab?' class="active"':'')+'>'+t.label+'</button>').join('');
  n.addEventListener('click',e=>{const b=e.target.closest('button');if(b){state.tab=b.dataset.tab;render();}});
}
document.addEventListener('click',e=>{
  const pb=e.target.closest('button[data-pg]');
  if(pb){if(!pb.disabled){state.page[pb.dataset.pg]=+pb.dataset.goto;render();}return;}
  const th=e.target.closest('th[data-col]');
  if(th){const k=th.dataset.sk,c=th.dataset.col,cur=state.sort[k];state.sort[k]=(cur&&cur.key===c)?{key:c,dir:cur.dir*-1}:{key:c,dir:1};state.page[k]=1;render();return;}
  if(e.target.id==='clearFilters'){state.filters={carrier:"",destination:"",week:"",status:"",issue:""};state.search={};state.page={};render();}
});
document.addEventListener('change',e=>{
  const pp=e.target.dataset.pp;if(pp){state.perPage[pp]=+e.target.value;state.page[pp]=1;render();return;}
  const f=e.target.dataset.filter;if(f){state.filters[f]=e.target.value;render();}});
document.addEventListener('input',e=>{const sf=e.target.dataset.sf;if(sf){state.search[sf]=e.target.value;state.page[sf]=1;const p=e.target.selectionStart;render();
  const nb=document.querySelector('input[data-sf="'+sf+'"]');if(nb){nb.focus();try{nb.setSelectionRange(p,p);}catch(_){}}}});
function applyTheme(){document.documentElement.setAttribute('data-theme',state.theme);
  document.getElementById('themeIcon').textContent=state.theme==='dark'?'☀️':'🌙';
  document.getElementById('themeTxt').textContent=state.theme==='dark'?'Light':'Dark';}
document.getElementById('themeBtn').addEventListener('click',()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('prd_theme',state.theme);applyTheme();});

const o=dashboardData.overview;
document.getElementById('hb-week').textContent=o.reporting_week;
document.getElementById('hb-refresh').textContent=o.as_of;
document.getElementById('weekband').innerHTML='<span class="dot"></span> REPORTING WEEK: '+esc(o.reporting_week)+' <span class="light">· '+esc(o.week_range)+' · use this label in disputes / EOD / chase emails</span>';
document.getElementById('footer').innerHTML='Postage Reconciliation System · data as of <b>'+o.as_of+'</b> · source: '+esc(dashboardData.metadata.source)+' · read-only · business logic preserved from workbook v3.4 · counts authoritative, £ from carrier_charge.';
applyTheme();initTabs();render();
</script>
